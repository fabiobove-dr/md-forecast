name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true
      - run: uv sync --locked --extra structural
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest
      - run: uv run --locked xenon --max-absolute A --max-modules A --max-average A src
      - run: uv build --no-sources
      - name: Install and smoke-test the wheel outside the checkout
        run: |
          uv venv /tmp/md-forecast-wheel --python 3.14
          uv pip install --python /tmp/md-forecast-wheel/bin/python dist/*.whl
          uv pip install --python /tmp/md-forecast-wheel/bin/python 'mdtraj==1.11.1.post2'
          cd /tmp
          /tmp/md-forecast-wheel/bin/python -c 'from md_forecast import __version__; from md_forecast.core.config import Settings; assert __version__; Settings()'
          /tmp/md-forecast-wheel/bin/python -c 'import numpy; import pyarrow; from md_forecast.data.schemas import TimeAxis; from md_forecast.data.series import read_series; assert TimeAxis(frame_count=3).frame_interval_ps is None'
          /tmp/md-forecast-wheel/bin/python -c 'import h5py; from md_forecast.data.public.misato import ExtractionConfig, extract_misato'
          /tmp/md-forecast-wheel/bin/python -c 'from md_forecast.data.splits import SplitConfig; from md_forecast.data.windows import WindowConfig; from md_forecast.data.preprocessing import fit_training_scaler; SplitConfig(mode="official", seed=42); WindowConfig(contexts=(2,), horizons=(1,), stride_frames=1)'
          /tmp/md-forecast-wheel/bin/md-forecast --version
          /tmp/md-forecast-wheel/bin/python -c 'from md_forecast.models.base import ModelConfig; from md_forecast.models.baselines import StatisticalBaseline; from md_forecast.models.learned import fit_nlinear, select_nlinear; from md_forecast.evaluation.baselines import evaluate_baselines; StatisticalBaseline(ModelConfig(model_id="persistence", seed=42))'
          /tmp/md-forecast-wheel/bin/md-forecast --help
          /tmp/md-forecast-wheel/bin/md-forecast qc-misato --help
          /tmp/md-forecast-wheel/bin/python -c 'from md_forecast.features.structural import validate_sasa_backend; validate_sasa_backend()'
      - run: uv run --locked mkdocs build --strict

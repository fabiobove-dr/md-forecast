# Development holdout: no official TEST data, no future-known covariates.
target = "ligand_rmsd"
batch_size = 4

[variants]
rmsd = ["ligand_rmsd"]
rmsd_com = ["ligand_rmsd", "ligand_receptor_com_distance"]
native = ["ligand_rmsd", "ligand_receptor_com_distance", "buried_sasa", "interaction_energy"]
native_geometry = ["ligand_rmsd", "ligand_receptor_com_distance", "buried_sasa", "interaction_energy", "protein_ligand_contact_count", "fraction_reference_contacts", "minimum_protein_ligand_heavy_distance"]

[split]
mode = "grouped"
seed = 42
ratios = [0.7, 0.3, 0.0]

[grid]
contexts = [40.0]
horizons = [10.0]
stride_frames = 10

[evaluation]
seed = 42
bootstrap_samples = 1000
confidence_level = 0.95
min_groups = 5
min_tail_samples = 10
comparison_family_size = 187
intervals = [[0.1, 0.9]]
max_prediction_rows = 1000000
max_bootstrap_bytes = 134217728

[chronos]
model_name = "amazon/chronos-2"
revision = "29ec3766d36d6f73f0696f85560a422f50e8498c"
device = "cuda:0"
dtype = "float32"
seed = 42
batch_size = 32
quantile_levels = [0.1, 0.5, 0.9]
max_vram_bytes = 7516192768

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "md-forecast"
dynamic = ["version"]
description = "Forecasting molecular dynamics observables from partial trajectories"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "httpx>=0.28,<1",
    "numpy>=2.3,<3",
    "pyarrow>=22,<26",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
md-forecast = "md_forecast.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.13,<1",
    "types-pyyaml>=6,<7",
    "xenon>=0.9,<1",
]
docs = ["mkdocs>=1.6,<2"]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.hatch.version]
path = "src/md_forecast/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/md_forecast"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=md_forecast --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["md_forecast"]

[tool.coverage.report]
show_missing = true
